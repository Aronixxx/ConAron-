workflows:
  conaron-android:
    name: ConAron Android AAB
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    cache:
      cache_paths:
        - $HOME/.gradle/caches

    scripts:
      - name: Verificar proyecto ConAron
        script: |
          set -e

          PROJECT_DIR="$CM_BUILD_DIR/ConAron_ANDROID_PLAYSTORE_LISTO_GITHUB_CODEMAGIC/ConAron_Android_PlayStore/ConAronAndroid"

          echo "Proyecto esperado:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: No existe la carpeta del proyecto."
            echo "Contenido del repositorio:"
            find "$CM_BUILD_DIR" -maxdepth 5 -type d | sort
            exit 1
          fi

          cd "$PROJECT_DIR"

          echo "Contenido del proyecto:"
          ls -la

          test -f settings.gradle || {
            echo "ERROR: No existe settings.gradle"
            exit 1
          }

          test -f build.gradle || {
            echo "ERROR: No existe build.gradle"
            exit 1
          }

          test -d app || {
            echo "ERROR: No existe la carpeta app"
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

          echo "Proyecto encontrado correctamente."

      - name: Configurar Android SDK
        script: |
          set -e

          cd "$PROJECT_DIR"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          echo "Contenido de local.properties:"
          cat local.properties

      - name: Preparar Gradle 8.11.1
        script: |
          set -e

          echo "Descargando Gradle 8.11.1..."

          curl -L --fail --retry 3 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o /tmp/gradle-8.11.1-bin.zip

          rm -rf /tmp/gradle-8.11.1

          unzip -q /tmp/gradle-8.11.1-bin.zip -d /tmp

          /tmp/gradle-8.11.1/bin/gradle --version

      - name: Generar ConAron AAB
        script: |
          set -e

          cd "$PROJECT_DIR"

          echo "Compilando ConAron..."

          /tmp/gradle-8.11.1/bin/gradle \
            clean \
            bundleRelease \
            --stacktrace

          echo ""
          echo "AAB encontrados:"
          find "$PROJECT_DIR" -type f -name "*.aab" -print

    artifacts:
      - ConAron_ANDROID_PLAYSTORE_LISTO_GITHUB_CODEMAGIC/ConAron_Android_PlayStore/ConAronAndroid/app/build/outputs/**/*.aab
      - ConAron_ANDROID_PLAYSTORE_LISTO_GITHUB_CODEMAGIC/ConAron_Android_PlayStore/ConAronAndroid/app/build/outputs/**/*.apk
      - ConAron_ANDROID_PLAYSTORE_LISTO_GITHUB_CODEMAGIC/ConAron_Android_PlayStore/ConAronAndroid/app/build/outputs/**/mapping.txt
