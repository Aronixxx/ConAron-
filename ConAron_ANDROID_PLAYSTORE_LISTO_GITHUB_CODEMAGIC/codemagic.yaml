workflows:
  conaron-android:
    name: ConAron Android AAB
    max_build_duration: 120
    instance_type: mac_mini_m2

    working_directory: ConAron_ANDROID_PLAYSTORE_LISTO_GITHUB_CODEMAGIC/ConAron_Android_PlayStore/ConAronAndroid

    environment:
      java: 17

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Verificar ubicación
        script: |
          echo "DIRECTORIO ACTUAL:"
          pwd
          echo ""
          echo "CONTENIDO:"
          ls -la

          test -f settings.gradle || {
            echo "ERROR: No existe settings.gradle"
            exit 1
          }

          test -f build.gradle || {
            echo "ERROR: No existe build.gradle"
            exit 1
          }

          test -d app || {
            echo "ERROR: No existe la carpeta app"
            exit 1
          }

          echo "Proyecto ConAron encontrado correctamente"

      - name: Configurar Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "SDK configurado:"
          cat local.properties

      - name: Preparar Gradle
        script: |
          if [ ! -f gradlew ]; then
            echo "Gradle Wrapper no existe. Creandolo..."

            curl -L --fail --retry 3 \
              https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
              -o /tmp/gradle-8.11.1-bin.zip

            rm -rf /tmp/gradle-8.11.1
            unzip -q /tmp/gradle-8.11.1-bin.zip -d /tmp

            /tmp/gradle-8.11.1/bin/gradle wrapper \
              --gradle-version 8.11.1
          fi

          chmod +x gradlew

          ./gradlew --version

      - name: Generar Android App Bundle
        script: |
          ./gradlew clean bundleRelease --stacktrace

          echo ""
          echo "AAB GENERADOS:"
          find app/build/outputs -type f -name "*.aab" -print || true

    artifacts:
      - ConAron_ANDROID_PLAYSTORE_LISTO_GITHUB_CODEMAGIC/ConAron_Android_PlayStore/ConAronAndroid/app/build/outputs/**/*.aab
      - ConAron_ANDROID_PLAYSTORE_LISTO_GITHUB_CODEMAGIC/ConAron_Android_PlayStore/ConAronAndroid/app/build/outputs/**/*.apk
      - ConAron_ANDROID_PLAYSTORE_LISTO_GITHUB_CODEMAGIC/ConAron_Android_PlayStore/ConAronAndroid/app/build/outputs/**/mapping.txt
