workflows:
  conaron-android:
    name: ConAron Android AAB
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Buscar proyecto Android
        script: |
          set -e

          echo "========================================"
          echo "BUSCANDO PROYECTO ANDROID"
          echo "========================================"

          echo "Directorio de Codemagic:"
          echo "$CM_BUILD_DIR"

          echo ""
          echo "Archivos encontrados:"
          find "$CM_BUILD_DIR" -maxdepth 6 -type f | sort | head -200

          GRADLEW_PATH=$(find "$CM_BUILD_DIR" -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW_PATH" ]; then
            echo ""
            echo "ERROR: No se encontro el archivo gradlew."
            echo "El proyecto Android no esta correctamente subido a GitHub."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          echo ""
          echo "Proyecto Android encontrado en:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

      - name: Verificar proyecto
        script: |
          set -e

          echo "========================================"
          echo "VERIFICANDO PROYECTO"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo "Directorio actual:"
          pwd

          echo ""
          echo "Contenido:"
          ls -la

          if [ ! -f "gradlew" ]; then
            echo "ERROR: No existe gradlew."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: No existe la carpeta app."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: No existe settings.gradle ni settings.gradle.kts."
            exit 1
          fi

          echo ""
          echo "Proyecto Android verificado correctamente."

      - name: Configurar Android SDK
        script: |
          set -e

          echo "========================================"
          echo "CONFIGURANDO ANDROID SDK"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          echo "Android SDK configurado."
          cat local.properties

      - name: Preparar Gradle
        script: |
          set -e

          echo "========================================"
          echo "PREPARANDO GRADLE"
          echo "========================================"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --version

      - name: Limpiar proyecto
        script: |
          set -e

          echo "========================================"
          echo "LIMPIANDO PROYECTO"
          echo "========================================"

          cd "$PROJECT_DIR"

          ./gradlew clean

      - name: Generar AAB Release
        script: |
          set -e

          echo "========================================"
          echo "GENERANDO CONARON AAB"
          echo "========================================"

          cd "$PROJECT_DIR"

          ./gradlew bundleRelease --stacktrace

          echo ""
          echo "========================================"
          echo "BUSCANDO AAB GENERADO"
          echo "========================================"

          find "$PROJECT_DIR" -type f -name "*.aab" -print

    artifacts:
      - "**/app/build/outputs/**/*.aab"
      - "**/app/build/outputs/**/*.apk"
      - "**/app/build/outputs/**/mapping.txt"
