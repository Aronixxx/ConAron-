workflows:
  conaron-android:
    name: ConAron Android AAB
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17
      vars:
        PACKAGE_NAME: "pe.conaron.app"

    scripts:
      - name: Buscar proyecto ConAron
        script: |
          set -e

          PROJECT_DIR="$(find "$CM_BUILD_DIR" -type f -name settings.gradle -print -quit | xargs -I{} dirname "{}")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontro settings.gradle"
            find "$CM_BUILD_DIR" -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Proyecto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Preparar Gradle 8.11.1
        script: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            curl -L --fail --retry 3 \
              https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
              -o /tmp/gradle.zip

            unzip -oq /tmp/gradle.zip -d /tmp

            /tmp/gradle-8.11.1/bin/gradle wrapper \
              --gradle-version 8.11.1
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Compilar ConAron AAB
        script: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew clean bundleRelease --stacktrace

    artifacts:
      - "**/app/build/outputs/bundle/release/*.aab"
      - "**/app/build/outputs/apk/release/*.apk"
      - "**/app/build/outputs/**/mapping.txt"
